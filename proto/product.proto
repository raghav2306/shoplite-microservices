syntax = "proto3";

package product;

service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
  rpc DecrementStock (DecrementStockRequest) returns (DecrementStockResponse);
  // Atomically reserves stock for every item (all or nothing) and returns current prices.
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
  // Returns previously reserved stock (order creation failed or order cancelled).
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockResponse);
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  int32 stock = 4;
}

message CreateProductResponse {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
}

message GetProductRequest {
  string productId = 1;
}

message GetProductResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
}

message ListProductsRequest {}

message ListProductsResponse {
  repeated GetProductResponse products = 1;
}

message CheckStockRequest {
  string productId = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool available = 1;
  int32 currentStock = 2;
}

message DecrementStockRequest {
  string productId = 1;
  int32 quantity = 2;
}

message DecrementStockResponse {
  bool success = 1;
  int32 remainingStock = 2;
}

message StockItem {
  string productId = 1;
  int32 quantity = 2;
}

message ReservedItem {
  string productId = 1;
  int32 quantity = 2;
  double price = 3;
}

message ReserveStockRequest {
  repeated StockItem items = 1;
}

message ReserveStockResponse {
  repeated ReservedItem items = 1;
}

message ReleaseStockRequest {
  repeated StockItem items = 1;
}

message ReleaseStockResponse {
  bool success = 1;
}
