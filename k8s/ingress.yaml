# Requires the AWS Load Balancer Controller (see README.md).
# One internet-facing ALB with an AWS-generated hostname, so no domain is needed:
#   http://<alb-hostname>/api/*   -> api-gateway (browser API calls, from both apps)
#   http://<alb-hostname>/admin/  -> admin
#   http://<alb-hostname>/        -> storefront
# Get the hostname with: kubectl -n ecommerce get ingress frontends
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontends
  namespace: ecommerce
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # route straight to pod IPs
    # Default for every target group; api-gateway's Service overrides it with /health
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - http:
        # Rules are evaluated in this order; the catch-all "/" must stay last.
        # The ALB doesn't strip prefixes: the gateway serves /api/*, and the
        # admin app is built to live under /admin/.
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  name: http
