apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          # Built for linux/amd64 and pushed by scripts/push-images.sh
          image: 573802369594.dkr.ecr.us-east-1.amazonaws.com/dev/storefront:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
