# EBS gp3 volumes for the MongoDB and RabbitMQ StatefulSets.
# Requires the aws-ebs-csi-driver EKS add-on (see README.md). EKS 1.30+ clusters
# have no default StorageClass, so the StatefulSets reference this one by name.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
# Create the volume in the AZ where the pod gets scheduled
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
