apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-users
spec:
  serviceName: mongodb-users
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-users
  template:
    metadata:
      labels:
        app: mongodb-users
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-users-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-users-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
