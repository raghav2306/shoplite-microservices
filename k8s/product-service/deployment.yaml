apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-deployment
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: product-service:v1
        ports:
        - containerPort: 50052
        startupProbe:
          grpc:
            port: 50052
            service: liveness
          periodSeconds: 5
          failureThreshold: 24  # up to 2 min to connect to Mongo on boot
        livenessProbe:
          grpc:
            port: 50052
            service: liveness
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 50052  # "" service = all dependencies (Mongo) up
          periodSeconds: 5
          failureThreshold: 2
