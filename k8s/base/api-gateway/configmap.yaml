apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  PORT: "3000"
  # Short Service names work here: Node uses the pod's DNS search domains
  USER_SERVICE_URL: user-service:50051
  PRODUCT_SERVICE_URL: product-service:50052
  # order-service has no manifests yet; /api/orders returns 503 until it does
  ORDER_SERVICE_URL: order-service:50053
