# Exposed through the ALB at /api (see ingress.yaml).
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  annotations:
    # Overrides the Ingress-wide /healthz for this target group; the gateway serves /health
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
