# Clients (order-service, notification-service) connect to amqp://rabbitmq:5672
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    # Management UI, internal only: kubectl -n <env> port-forward svc/rabbitmq 15672
    - name: management
      port: 15672
      targetPort: management
---
# Gives the StatefulSet pod a stable DNS name: rabbitmq-0.rabbitmq-headless
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
