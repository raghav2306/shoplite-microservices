apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-products
  namespace: ecommerce
spec:
  serviceName: mongodb-products
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-products
  template:
    metadata:
      labels:
        app: mongodb-products
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - name: mongodb
              containerPort: 27017
          # Root user is created on first start only (when the volume is empty)
          envFrom:
            - secretRef:
                name: mongodb-products-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ebs-gp3 # defined in 00-storageclass.yaml
        resources:
          requests:
            storage: 1Gi
