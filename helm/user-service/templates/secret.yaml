{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "user-service.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Pass at install time: --set secret.jwtSecret="$(openssl rand -hex 32)"
  JWT_SECRET: {{ required "secret.jwtSecret is required (or set secret.create=false and secret.existingSecret)" .Values.secret.jwtSecret | quote }}
{{- end }}
